<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Glow Theory · Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* VOICE: warm, tender beauty editor; short sentences, no hype.
   IDEA: a boutique shelf card from a beauty counter; each guide is a shelf you browse.
   PICTURE: hand-drawn SVG products sitting on a magenta shelf, large in each hero.
   COLOUR and TYPE: Glow Theory magenta field, cream ground, blush accent; Playfair Display titles, DM Sans body.
   LAYOUT: one column, phone first; hero band full width, picks as shelf cards, sticky shop button per card. */
:root{color-scheme:light dark;
--bg:light-dark(#FFF7F2,#1d1117);--card:light-dark(#ffffff,#2a1922);--ink:light-dark(#3b2430,#f8e9ef);--muted:light-dark(#6f5662,#cfb3c0);
--line:light-dark(#f6dbe6,#43293a);--mag:light-dark(#BE185D,#f0679f);--magfield:#BE185D;--blush:light-dark(#ffe1ec,#3a2030);--soft:#FF9EC8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip}
a{color:var(--mag)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(5vw,16px);border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 17px "Playfair Display",Georgia,serif}
.seal{width:34px;height:34px;border-radius:50%;background:var(--magfield);display:grid;place-items:center}
.top .all{font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:40px;display:inline-flex;align-items:center}
.hero{background:var(--magfield);color:#fff;padding:clamp(26px,5vw,56px) max(5vw,16px) 0;overflow:hidden}
.hero .in{max-width:1100px;margin:0 auto;display:grid;gap:18px}
.kick{font-size:14px;opacity:.85;margin:0}
h1{font:700 clamp(32px,6vw,50px)/1.05 "Playfair Display",Georgia,serif;margin:0;text-wrap:balance}
.lede{font-size:17px;max-width:58ch;margin:0;opacity:.95}
.shelf{position:relative;height:clamp(150px,26vw,230px);margin-top:8px}
.shelf .plank{position:absolute;left:-10vw;right:-10vw;bottom:0;height:22px;background:#8f0f45;box-shadow:0 -2px 0 #e0478a inset}
.shelf .row{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,2vw,20px)}
.shelf svg{height:clamp(110px,20vw,190px);width:auto;flex:none;filter:drop-shadow(0 10px 8px rgba(60,0,25,.35))}
main{max-width:760px;margin:0 auto;padding:22px max(4vw,14px) 56px}
.disc{background:var(--blush);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);margin:0 0 22px}
.picks{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:p}
.pick{background:var(--card);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:14px;counter-increment:p}
.pick .art{background:var(--blush);border-radius:14px;display:grid;place-items:center;aspect-ratio:1}
.pick .art svg{width:88%;height:auto}
.pick h3{font:600 20px/1.2 "Playfair Display",Georgia,serif;margin:2px 0 4px}
.pick h3::before{content:counter(p) ". ";color:var(--mag)}
.pick p{margin:0 0 10px;color:var(--muted)}
.pick .use{font-size:14px;color:var(--ink);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--magfield);color:#fff;font-weight:700;text-decoration:none;font-size:15px}
.btn:hover{background:#9d1450}
.btn:focus-visible,.top a:focus-visible,.card:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
h2{font:600 24px/1.2 "Playfair Display",Georgia,serif;margin:34px 0 12px}
.steps{margin:0;padding-left:22px}.steps li{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card .pic{background:var(--blush);display:flex;justify-content:center;align-items:flex-end;gap:2px;height:120px;padding:10px 8px 0}
.card .pic svg{height:96px;width:auto}
.card b{display:block;font:600 18px/1.2 "Playfair Display",Georgia,serif;padding:12px 14px 2px}
.card span{display:block;padding:0 14px 14px;font-size:14px;color:var(--muted)}
.next{margin-top:30px;padding:18px;border-radius:18px;background:var(--blush)}
.next p{margin:0 0 10px}
footer{border-top:1px solid var(--line);padding:22px max(5vw,16px) 40px;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:600px){.pick{grid-template-columns:84px minmax(0,1fr);gap:12px}.pick .btn{width:100%;justify-content:center}}
@media(prefers-reduced-motion:no-preference){.shelf .row svg{animation:up .5s ease-out both}.shelf .row svg:nth-child(2){animation-delay:.08s}.shelf .row svg:nth-child(3){animation-delay:.16s}.shelf .row svg:nth-child(4){animation-delay:.24s}@keyframes up{from{transform:translateY(24px);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><span class="seal" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3c2 3 2 6 0 9-2-3-2-6 0-9zm0 9c3-1 6 0 8 2-3 1-6 0-8-2zm0 0c-3-1-6 0-8 2 3 1 6 0 8-2z" fill="#fff"/></svg></span>The Glow Theory</a>
  <a class="all" href="#home">All guides</a>
</header>
<div id="view"></div>
<footer>As an Amazon Associate I earn from qualifying purchases. · Follow <a href="https://www.instagram.com/theglowtheory.edit/">@theglowtheory.edit</a></footer>

<script>
{
const AMZ=a=>'https://www.amazon.com/dp/'+a+'?tag=glowtheoryig-20';
/* product illustrations: each returns an SVG on a 120x140 canvas */
const S=(body)=>`<svg viewBox="0 0 120 140" role="img" aria-hidden="true">${body}</svg>`;
const shapes={
 jar:(c,l)=>S(`<rect x="22" y="58" width="76" height="72" rx="14" fill="${c}"/><rect x="18" y="40" width="84" height="24" rx="8" fill="${l}"/><rect x="30" y="70" width="12" height="48" rx="6" fill="#fff" opacity=".35"/><rect x="38" y="86" width="44" height="18" rx="4" fill="#fff" opacity=".8"/>`),
 pump:(c,l)=>S(`<rect x="34" y="50" width="52" height="84" rx="12" fill="${c}"/><rect x="52" y="22" width="16" height="30" fill="${l}"/><rect x="52" y="16" width="34" height="9" rx="4" fill="${l}"/><rect x="40" y="62" width="9" height="60" rx="4" fill="#fff" opacity=".4"/><rect x="42" y="84" width="36" height="22" rx="3" fill="#fff" opacity=".85"/>`),
 dropper:(c,l)=>S(`<rect x="36" y="66" width="48" height="68" rx="10" fill="${c}"/><rect x="46" y="46" width="28" height="22" rx="4" fill="${l}"/><rect x="52" y="14" width="16" height="34" rx="8" fill="${l}"/><rect x="42" y="76" width="8" height="48" rx="4" fill="#fff" opacity=".4"/><rect x="44" y="92" width="32" height="18" rx="3" fill="#fff" opacity=".85"/>`),
 tube:(c,l)=>S(`<path d="M38 22h44l-6 100H44z" fill="${c}"/><rect x="44" y="118" width="32" height="18" rx="3" fill="${l}"/><rect x="44" y="30" width="8" height="70" rx="4" fill="#fff" opacity=".4"/><rect x="50" y="56" width="22" height="26" rx="3" fill="#fff" opacity=".85"/>`),
 patch:(c,l)=>S(`<rect x="18" y="40" width="84" height="92" rx="12" fill="${c}"/>${[0,1,2].map(r=>[0,1,2].map(k=>`<circle cx="${38+k*22}" cy="${62+r*24}" r="8" fill="${l}"/>`).join('')).join('')}`),
 pillow:(c,l)=>S(`<path d="M10 70q50-22 100 0v50q-50 18-100 0z" fill="${c}"/><path d="M10 70q50-22 100 0" stroke="${l}" stroke-width="4" fill="none"/><path d="M26 96q34-10 68 0" stroke="#fff" stroke-width="3" opacity=".5" fill="none"/>`),
 roller:(c,l)=>S(`<rect x="54" y="60" width="12" height="76" rx="6" fill="${l}"/><rect x="24" y="30" width="72" height="34" rx="17" fill="${c}"/><rect x="32" y="36" width="40" height="7" rx="3" fill="#fff" opacity=".5"/>`),
 guasha:(c,l)=>S(`<path d="M60 128c-34-20-48-46-40-70 8-22 32-20 40-4 8-16 32-18 40 4 8 24-6 50-40 70z" fill="${c}"/><path d="M36 64c6-10 16-10 20 0" stroke="#fff" stroke-width="4" opacity=".55" fill="none"/><circle cx="60" cy="78" r="5" fill="${l}"/>`),
 scrub:(c,l)=>S(`<circle cx="60" cy="86" r="44" fill="${c}"/>${Array.from({length:19},(_,i)=>{const a=i*2.4,r=i<1?0:12+(i%3)*10;return `<circle cx="${60+Math.cos(a)*r}" cy="${86+Math.sin(a)*r}" r="3.4" fill="${l}"/>`}).join('')}`),
 mask:(c,l)=>S(`<path d="M60 22c30 0 44 26 44 54 0 32-22 58-44 58S16 108 16 76c0-28 14-54 44-54z" fill="${c}"/><ellipse cx="44" cy="70" rx="10" ry="6" fill="#2b1520"/><ellipse cx="76" cy="70" rx="10" ry="6" fill="#2b1520"/>${[[34,94],[50,104],[70,104],[86,94],[60,50],[40,48],[80,48]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${l}"/>`).join('')}`),
 wand:(c,l)=>S(`<rect x="46" y="40" width="28" height="96" rx="14" fill="${c}"/><circle cx="60" cy="30" r="18" fill="${l}"/><circle cx="60" cy="80" r="6" fill="#fff" opacity=".8"/><rect x="52" y="48" width="6" height="70" rx="3" fill="#fff" opacity=".35"/>`),
 rod:(c,l)=>S(`<path d="M18 100q42-90 84 0" stroke="${c}" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M30 92q30-64 60 0" stroke="#fff" stroke-width="3" opacity=".45" fill="none"/><circle cx="18" cy="104" r="9" fill="${l}"/><circle cx="102" cy="104" r="9" fill="${l}"/>`),
 bomb:(c,l)=>S(`<circle cx="42" cy="104" r="28" fill="${c}"/><circle cx="82" cy="100" r="24" fill="${l}"/><circle cx="62" cy="70" r="22" fill="${c}" opacity=".8"/><circle cx="34" cy="96" r="5" fill="#fff" opacity=".6"/>`),
 fridge:(c,l)=>S(`<rect x="22" y="30" width="76" height="104" rx="14" fill="${c}"/><rect x="30" y="40" width="60" height="84" rx="8" fill="${l}"/><rect x="80" y="62" width="5" height="34" rx="2" fill="#fff"/><rect x="36" y="58" width="22" height="7" rx="3" fill="#fff" opacity=".7"/>`),
 drawers:(c,l)=>S(`${[0,1,2].map(i=>`<rect x="18" y="${44+i*30}" width="84" height="26" rx="6" fill="${c}" opacity="${.65+i*.15}"/><rect x="50" y="${54+i*30}" width="20" height="5" rx="2" fill="${l}"/>`).join('')}`),
 book:(c,l)=>S(`<rect x="26" y="26" width="70" height="106" rx="8" fill="${c}"/><rect x="26" y="26" width="12" height="106" rx="4" fill="${l}"/><path d="M60 62c4-8 16-8 16 2 0 10-16 18-16 18s-16-8-16-18c0-10 12-10 16-2z" fill="#fff" opacity=".85"/>`),
 kit:(c,l)=>S(`<rect x="16" y="60" width="88" height="72" rx="10" fill="${c}"/><rect x="54" y="60" width="12" height="72" fill="${l}"/><rect x="12" y="48" width="96" height="18" rx="6" fill="${c}"/><path d="M60 48c-14-20-30-8-18 0zm0 0c14-20 30-8 18 0z" fill="${l}"/>`)
};
const P={
 lipmask:{n:'LANEIGE Lip Sleeping Mask',a:'B07XXPHQZK',s:'jar',c:['#f472b6','#be185d'],why:'The overnight lip treatment people actually finish.',use:'Swipe a thick layer on last thing at night.'},
 silk:{n:'Mulberry silk pillowcase',a:'B01LVU7THF',s:'pillow',c:['#fbcfe8','#ec4899'],why:'Less tug on hair and skin while you sleep.',use:'Wash cool and gentle; skip the fabric softener.'},
 ice:{n:'Ice roller',a:'B0CP39FLF2',s:'roller',c:['#7dd3fc','#0e7490'],why:'Cold, quick de-puff for tired morning eyes.',use:'Keep it in the freezer, roll outward for 2 to 5 minutes.'},
 guasha:{n:'Gua sha tool',a:'B0BS9KTVRZ',s:'guasha',c:['#cbd5e1','#64748b'],why:'A five-minute ritual that helps with morning puffiness.',use:'Always over oil or serum, light pressure, strokes outward.'},
 bath:{n:'Bath bomb gift set',a:'B01MFGN8S5',s:'bomb',c:['#f9a8d4','#c084fc'],why:'A whole self-care night in one box.',use:'One per bath; lights low, phone away.'},
 kit:{n:'SKIN1004 Centella travel kit',a:'B09S6JKB52',s:'kit',c:['#a7f3d0','#047857'],why:'A gentle starter routine for sensitive skin.',use:'Try one product at a time to see what her skin likes.'},
 scrub:{n:'Tree Hut body scrub',a:'B01CGRN8IU',s:'jar',c:['#fda4af','#9f1239'],why:'Smooth skin in one shower, and it smells like a spa.',use:'On damp skin, 2 to 3 times a week, then moisturise.'},
 fridge:{n:'Skincare mini fridge',a:'B0BQ5DGSXH',s:'fridge',c:['#fecdd3','#fff1f2'],why:'Keeps rollers and gel products cool and in one place.',use:'Set it to cool, not cold; leave room for air to move.'},
 drawers:{n:'Clear stackable makeup drawers',a:'B0F3NLJCSP',s:'drawers',c:['#e9d5ff','#7e22ce'],why:'Everything visible, nothing lost at the back.',use:'One drawer each for AM, PM and tools.'},
 cerave:{n:'CeraVe Hydrating Cleanser',a:'B07RL88DD2',s:'pump',c:['#bfdbfe','#1d4ed8'],why:'Gentle, non-stripping cleanse that suits most skin.',use:'Massage onto damp skin for 30 seconds, rinse lukewarm.'},
 vitc:{n:'TruSkin Vitamin C Serum',a:'B01M4MCUAF',s:'dropper',c:['#fdba74','#c2410c'],why:'A brightening step for the morning.',use:'3 to 4 drops after cleansing, always followed by SPF.'},
 nia:{n:'The Ordinary Niacinamide 10% + Zinc',a:'B0DDQ4MSXS',s:'dropper',c:['#e7e5e4','#57534e'],why:'Budget serum for oil and visible pores.',use:'A few drops before moisturiser; patch test first.'},
 spf:{n:'La Roche-Posay Anthelios SPF',a:'B0FBS4C2FY',s:'tube',c:['#fde68a','#b45309'],why:'The step that protects everything else you do.',use:'Last step every morning; reapply when you are outdoors.'},
 snail:{n:'COSRX Snail Mucin 96% Essence',a:'B00PBX3L7K',s:'dropper',c:['#ddd6fe','#6d28d9'],why:'Bouncy hydration for that glass-skin look.',use:'Pat in after cleansing, before moisturiser.'},
 patch:{n:'Mighty Patch Original',a:'B074PVTPBW',s:'patch',c:['#fef3c7','#d97706'],why:'Overnight help for a single spot.',use:'On clean, dry skin before bed; peel off in the morning.'},
 rod:{n:'Heatless curling rod',a:'B0995G69ZJ',s:'rod',c:['#fbcfe8','#db2777'],why:'Soft curls overnight with no heat.',use:'Wrap slightly damp hair, sleep, unwrap in the morning.'},
 scrubber:{n:'Silicone face scrubber',a:'B08GZJ3XH8',s:'scrub',c:['#f9a8d4','#9d174d'],why:'A gentler second cleanse than a rough cloth.',use:'Small circles with cleanser, rinse and air-dry.'},
 led:{n:'LED light therapy mask',a:'B0DYG4Q6PL',s:'mask',c:['#f1f5f9','#ef4444'],why:'An at-home red-light routine (premium pick).',use:'Follow the device timing; consistency matters more than length.'},
 micro:{n:'Microcurrent facial device',a:'B0GY4KRM1R',s:'wand',c:['#e2e8f0','#be185d'],why:'An at-home facial lifting routine.',use:'Use with the conductive gel; follow the device instructions.'},
 journal:{n:'Self-care journal',a:'B09HC96K78',s:'book',c:['#f9a8d4','#831843'],why:'Glow from the inside: five minutes of reflection.',use:'Morning intention, evening gratitude.'}
};
const art=k=>{const p=P[k];return shapes[p.s](p.c[0],p.c[1])};
/* guides: one per post, headline matches the post's hook */
const G=[
 {id:'gifts-she-will-use',t:"3 skincare gifts she'll actually use",k:'From the Reel · 23 Nov',l:"Skip the random gift set. These three get used every single day.",p:['lipmask','silk','ice'],nx:'gifts-under-50'},
 {id:'gifts-under-50',t:'Glow gifts under $50',k:'From the carousel · 25 Nov',l:"Six gifts that fit a real routine. Prices move fast this week, so check each listing.",p:['lipmask','silk','ice','guasha','bath','kit'],nx:'self-care-night'},
 {id:'ice-roller',t:'Puffy morning face? Give me five minutes.',k:'From the Reel · 26 Nov',l:'The cold de-puff routine from the video, step by step.',p:['ice'],steps:['Keep the roller in the freezer overnight.','Start under the eyes and roll outward, never toward the nose.','Move to the cheeks, then along the jaw, still outward.','Two to five minutes is plenty. Results vary from person to person.'],nx:'am-routine'},
 {id:'vanity-glow-up',t:'Your vanity, but make it calm',k:'From the carousel · 27 Nov',l:'Two upgrades did most of the work. Then sort by routine: AM, PM, tools.',p:['drawers','fridge'],nx:'tools'},
 {id:'self-care-night',t:'My Saturday self-care night',k:'From the Reel · 29 Nov',l:'Twenty minutes, phone face down. Everything from the routine, in order.',p:['bath','scrub','lipmask','silk'],nx:'pm-routine'},
 {id:'am-routine',t:'A 4-step morning routine',k:'Routine guide',l:'Cleanse, treat, protect. The derm-approved basics.',p:['cerave','vitc','nia','spf'],nx:'pm-routine'},
 {id:'pm-routine',t:'The night routine for glass skin',k:'Routine guide',l:'Hydrate, repair, and let sleep do the rest.',p:['snail','patch','lipmask','silk','rod'],nx:'tools'},
 {id:'tools',t:'Skincare tools worth the drawer space',k:'Tools guide',l:'From a five-minute freebie ritual to the premium devices.',p:['ice','guasha','scrubber','led','micro'],nx:'gifts-under-50'},
 {id:'shop-all',t:'Everything I recommend',k:'Shop all',l:'Every product from my posts, in one place.',p:Object.keys(P),nx:'home'}
];
const byId=Object.fromEntries(G.map(g=>[g.id,g]));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const shelf=keys=>`<div class="shelf"><div class="row">${keys.slice(0,4).map(art).join('')}</div><div class="plank"></div></div>`;
const disc=`<p class="disc">As an Amazon Associate I earn from qualifying purchases. Links open Amazon US; prices and availability change, so check the listing before you buy.</p>`;
const card=g=>`<a class="card" href="#${g.id}"><div class="pic">${g.p.slice(0,3).map(art).join('')}</div><b>${esc(g.t)}</b><span>${esc(g.k)}</span></a>`;
const home=()=>`<section class="hero"><div class="in"><p class="kick">Skincare &amp; self-care, simplified</p><h1>Find the picks from the post you just saw</h1><p class="lede">Tap the guide that matches the post. Every product is one I recommend, with how to use it.</p>${shelf(['lipmask','ice','snail','silk'])}</div></section>
<main>${disc}<h2>From recent posts</h2><div class="grid">${G.slice(0,5).map(card).join('')}</div><h2>Routines and tools</h2><div class="grid">${G.slice(5).map(card).join('')}</div></main>`;
const guide=g=>`<section class="hero"><div class="in"><p class="kick">${esc(g.k)}</p><h1>${esc(g.t)}</h1><p class="lede">${esc(g.l)}</p>${shelf(g.p)}</div></section>
<main>${disc}${g.steps?`<h2>How to do it</h2><ol class="steps">${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h2>What I use</h2>`:''}
<ol class="picks">${g.p.map(k=>{const p=P[k];return `<li class="pick"><div class="art">${art(k)}</div><div><h3>${esc(p.n)}</h3><p>${esc(p.why)}</p><div class="use"><b>How to use:</b> ${esc(p.use)}</div><a class="btn" rel="sponsored noopener" target="_blank" href="${AMZ(p.a)}">View on Amazon</a></div></li>`}).join('')}</ol>
${g.nx&&byId[g.nx]?`<div class="next"><p>Next up</p>${card(byId[g.nx])}</div>`:''}</main>`;
const root=document.getElementById('view');
const render=()=>{const id=location.hash.slice(1);const g=byId[id];root.innerHTML=g?guide(g):home();document.title=(g?g.t+' · ':'')+'The Glow Theory';window.scrollTo(0,0)};
window.addEventListener('hashchange',render);render();
}
</script>
</body>
</html>
